name: Build and Release PST Bot

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build Executables
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build React Frontend
        working-directory: ./PST_Web
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PST_MASTER with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name "PST_MASTER" `
          --add-data "PST_Core/dashboard/templates;PST_Core/dashboard/templates" `
          --add-data "PST_Web/dist;PST_Web/dist" `
          --hidden-import "pandas" `
          --hidden-import "pandas_ta" `
          --hidden-import "MetaTrader5" `
          --hidden-import "fastapi" `
          --hidden-import "uvicorn" `
          --hidden-import "aiosqlite" `
          --hidden-import "pydantic" `
          --hidden-import "telegram" `
          PST_API/main.py

      - name: Build PST_LAUNCHER with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name "PST_LAUNCHER" `
          --hidden-import "requests" `
          Tools/updater_launcher.py

      - name: List dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) { ls dist } else { Write-Error "Dist directory not found" }

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item "dist\PST_MASTER.exe" -Destination "release_assets\" -ErrorAction Stop
          Copy-Item "dist\PST_LAUNCHER.exe" -Destination "release_assets\" -ErrorAction Stop
          Copy-Item "version.txt" -Destination "release_assets\" -ErrorAction Stop

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
