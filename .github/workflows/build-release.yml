name: Build and Release PST Bot

# Flujo automático: al fusionar a main con version.txt subido, este workflow
# crea el tag v<version> y compila la Release en el mismo run.
# Un tag v* empujado a mano también dispara el build (respaldo).
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Un solo release a la vez para no pisar tags.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Crear tag desde version.txt
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      create: ${{ steps.version.outputs.create }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Calcular tag y crearlo si no existe
        id: version
        run: |
          V=$(tr -d '[:space:]' < version.txt)
          V=${V#v}
          T="v$V"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          # Solo en pushes a main: si el tag ya existe, no hay release nueva.
          if [ "${GITHUB_REF_TYPE}" = "branch" ] && [ -z "$(git ls-remote --tags origin "refs/tags/$T")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$T" "$GITHUB_SHA"
            git push origin "refs/tags/$T"
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "create=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build Executables
    needs: tag
    if: ${{ needs.tag.outputs.create == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build React Frontend
        working-directory: ./PST_Web
        run: |
          npm install
          npm run build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PST_MASTER with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "PST_MASTER" `
          --collect-all "PST_Core" `
          --collect-all "PST_API" `
          --add-data "PST_Core/dashboard/templates;PST_Core/dashboard/templates" `
          --add-data "PST_Web/dist;PST_Web/dist" `
          --add-data "PST_LLM;PST_LLM" `
          --add-data "PST_Core;PST_Core" `
          --add-data "MT5;MT5" `
          --add-data ".agents/run_agent.py;.agents" `
          --add-data ".agents/scheduler.py;.agents" `
          --paths "PST_LLM" `
          --hidden-import "pandas" `
          --hidden-import "pandas_ta" `
          --hidden-import "MetaTrader5" `
          --hidden-import "fastapi" `
          --hidden-import "uvicorn" `
          --hidden-import "aiosqlite" `
          --hidden-import "pydantic" `
          --hidden-import "telegram" `
          --hidden-import "webview" `
          --hidden-import "clr" `
          --hidden-import "aiohttp" `
          --hidden-import "psutil" `
          PST_MASTER.py

      - name: Inject distribution token for PST_LAUNCHER
        shell: pwsh
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          Set-Content -Path "Tools/_dist_token.py" -Value "DIST_TOKEN = `"$env:DIST_TOKEN`"" -Encoding utf8

      - name: Build PST_LAUNCHER with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "PST_LAUNCHER" `
          --hidden-import "requests" `
          Tools/updater_launcher.py

      - name: List dist directory
        shell: pwsh
        run: |
          if (Test-Path dist) { ls dist } else { Write-Error "Dist directory not found" }

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_assets
          Copy-Item "dist\PST_MASTER.exe" -Destination "release_assets\" -ErrorAction Stop
          Copy-Item "dist\PST_LAUNCHER.exe" -Destination "release_assets\" -ErrorAction Stop
          Copy-Item "version.txt" -Destination "release_assets\" -ErrorAction Stop

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
